_format_version: "3.0"
_info:
  select_tags:
    - fapi2-demo
    - fapi2-foundation

certificates:
  - id: 11111111-1111-4111-8111-111111111111
    cert: "${{ env "DECK_ROUTE_A_TLS_CERT_YAML" }}"
    key: "{vault://env/ROUTE_A_TLS_KEY}"
    tags: [fapi2-demo, fapi2-foundation]
  - id: 22222222-2222-4222-8222-222222222222
    cert: "${{ env "DECK_ROUTE_B_TLS_CERT_YAML" }}"
    key: "{vault://env/ROUTE_B_TLS_KEY}"
    tags: [fapi2-demo, fapi2-foundation]

ca_certificates:
  - id: 33333333-3333-4333-8333-333333333333
    cert: "${{ env "DECK_FAPI_CA_CERT_YAML" }}"
    tags: [fapi2-demo, fapi2-foundation]

plugins:
  - id: 88888888-8888-4888-8888-888888888888
    name: fapi-as-mtls-transport
    enabled: true
    protocols: [http, https]
    tags: [fapi2-demo, fapi2-foundation]
    config:
      issuer: https://localhost:8444/realms/fapi-demo
      internal_origin: https://keycloak:8443
      discovery_url: https://keycloak:8443/realms/fapi-demo/.well-known/openid-configuration
      jwks_url: https://keycloak:8443/realms/fapi-demo/protocol/openid-connect/certs
      par_url: https://keycloak:8443/realms/fapi-demo/protocol/openid-connect/ext/par/request
      token_url: https://keycloak:8443/realms/fapi-demo/protocol/openid-connect/token
      revocation_url: https://keycloak:8443/realms/fapi-demo/protocol/openid-connect/revoke
      metadata_certificate_file: /etc/kong/fapi/third-party-metadata.crt
      metadata_key_file: /etc/kong/fapi/third-party-metadata.key
      routes:
        - route_id: 754519ff-b0b9-5ed5-94c0-e453d260c6c4
          logical_route: A
          client_id: third-party-fapi-mtls
          certificate_file: /etc/kong/fapi/route-a.crt
          key_file: /etc/kong/fapi/route-a.key
        - route_id: 0f45debe-a3a6-5207-aea3-637227fb96f2
          logical_route: B
          client_id: third-party-fapi-pkj-mtls
          certificate_file: /etc/kong/fapi/route-b.crt
          key_file: /etc/kong/fapi/route-b.key
      evidence_correlation_enabled: false
