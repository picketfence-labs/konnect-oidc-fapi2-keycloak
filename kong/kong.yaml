_format_version: "3.0"

upstreams:
  - name: oidc-sales-upstream
    host_header: httpbin.konghq.com
    tags: [oidc-routing-demo]
    targets:
      - target: httpbin.konghq.com:443
        weight: 100
        tags: [oidc-routing-demo]
  - name: oidc-engineering-upstream
    host_header: httpbin.konghq.com
    tags: [oidc-routing-demo]
    targets:
      - target: httpbin.konghq.com:443
        weight: 100
        tags: [oidc-routing-demo]
  - name: oidc-default-upstream
    host_header: httpbin.konghq.com
    tags: [oidc-routing-demo]
    targets:
      - target: httpbin.konghq.com:443
        weight: 100
        tags: [oidc-routing-demo]

services:
  - name: oidc-httpbin-service
    protocol: https
    host: oidc-default-upstream
    port: 443
    path: /anything
    tags: [oidc-routing-demo]
    routes:
      - name: oidc-routing-demo-route
        paths: [/api/demo]
        strip_path: true
        tags: [oidc-routing-demo]
    plugins:
      - name: cors
        tags: [oidc-routing-demo]
        config:
          origins: [http://localhost:3000]
          methods: [GET, OPTIONS]
          headers: [Accept, Content-Type, X-Demo-Department, X-Demo-Route]
          credentials: true
          max_age: 3600
      - name: openid-connect
        tags: [oidc-routing-demo]
        config:
          issuer: ${{ env "DECK_AUTH0_ISSUER" }}
          client_id: [${{ env "DECK_AUTH0_CLIENT_ID" }}]
          client_secret: [${{ env "DECK_AUTH0_CLIENT_SECRET" }}]
          # Keep this aligned with infra/auth0.tf. Browser login on 3.16 was verified.
          client_auth: [client_secret_basic]
          ssl_verify: true
          auth_methods: [authorization_code, session]
          scopes: [openid, profile, email]
          redirect_uri: ["http://localhost:8000/api/demo"]
          authorization_query_args_names: [audience]
          authorization_query_args_values: [${{ env "DECK_AUTH0_AUDIENCE" }}]
          require_proof_key_for_code_exchange: true
          login_action: redirect
          login_redirect_uri: ["http://localhost:3000/?authenticated=1"]
          login_tokens: []
          session_secret: ${{ env "DECK_SESSION_SECRET" }}
          cache_tokens_salt: ${{ env "DECK_CACHE_TOKENS_SALT" }}
          upstream_headers:
            - header: X-Demo-Department
              path: [${{ env "DECK_DEPARTMENT_CLAIM" }}]
            - header: X-Demo-Route
              path: [${{ env "DECK_ROUTE_CLAIM" }}]
      - name: route-by-header
        tags: [oidc-routing-demo]
        config:
          rules:
            - condition: {X-Demo-Department: sales, X-Demo-Route: sales-route}
              upstream_name: oidc-sales-upstream
            - condition: {X-Demo-Department: engineering, X-Demo-Route: engineering-route}
              upstream_name: oidc-engineering-upstream
      - name: request-transformer
        tags: [oidc-routing-demo]
        config:
          remove:
            headers: [Authorization, Cookie]
