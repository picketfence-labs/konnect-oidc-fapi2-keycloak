name: Build and publish demo images

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: kong
            context: ./kong
            repository: ghcr.io/picketfence-labs/konnect-oidc-header-routing
          - name: pop-verifier
            context: ./pop-verifier
            repository: ghcr.io/picketfence-labs/konnect-oidc-header-routing/pop-verifier
    steps:
      - uses: actions/checkout@v4

      - name: Run unit and static tests
        run: make test

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          load: true
          tags: local/${{ matrix.image.name }}:test

      - name: Run Kong plugin unit tests
        if: matrix.image.name == 'kong'
        run: docker run --rm --entrypoint luajit -v "$PWD:/src:ro" -w /src local/kong:test tests/test_plugin.lua

      - name: Run PoP verifier unit tests
        if: matrix.image.name == 'pop-verifier'
        run: docker run --rm -v "$PWD:/src:ro" -w /src -e PYTHONPATH=/app local/pop-verifier:test python tests/test_pop_verifier.py

      - name: Smoke test image
        run: docker image inspect local/${{ matrix.image.name }}:test >/dev/null

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: local/${{ matrix.image.name }}:test
          artifact-name: ${{ matrix.image.name }}-sbom.spdx.json

      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: local/${{ matrix.image.name }}:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Sign in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        id: publish
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ matrix.image.repository }}:sha-${{ github.sha }}

      - name: Record image digest
        if: github.event_name == 'push'
        run: echo '${{ matrix.image.name }} ${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
