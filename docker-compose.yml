services:
  kong:
    image: kong/kong-gateway:3.16.0.0
    restart: unless-stopped
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: ${KONNECT_CP_HOST}:443
      KONG_CLUSTER_SERVER_NAME: ${KONNECT_CP_HOST}
      KONG_CLUSTER_TELEMETRY_ENDPOINT: ${KONNECT_TP_HOST}:443
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: ${KONNECT_TP_HOST}
      KONG_CLUSTER_CERT: /etc/kong/certs/tls.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/certs/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_KONNECT_MODE: "on"
      KONG_ROUTER_FLAVOR: expressions
      KONG_LOG_LEVEL: notice
    volumes:
      - ./infra/certs:/etc/kong/certs:ro
    ports:
      - "8000:8000"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  ui:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
