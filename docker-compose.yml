services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--https-port=8443"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://localhost:8444
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/tls.key
      KC_HTTPS_CLIENT_AUTH: request
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/trust/ca.crt
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./.generated/keycloak/realm.json:/opt/keycloak/data/import/fapi-demo-realm.json:ro
      - ./.generated/pki/keycloak.crt:/opt/keycloak/conf/tls/tls.crt:ro
      - ./.generated/pki/keycloak.key:/opt/keycloak/conf/tls/tls.key:ro
      - ./.generated/pki/ca.crt:/opt/keycloak/conf/trust/ca.crt:ro
      - ./keycloak/data:/opt/keycloak/data/h2
    ports:
      - "8444:8443"

  pop-verifier:
    build:
      context: ./pop-verifier
    image: ghcr.io/picketfence-labs/konnect-oidc-fapi2-keycloak/pop-verifier:${APP_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      OIDC_ISSUER: https://localhost:8444/realms/fapi-demo
      OIDC_JWKS_URL: https://keycloak:8443/realms/fapi-demo/protocol/openid-connect/certs
      OIDC_AUDIENCE: pop-verifier
      OIDC_REQUIRED_SCOPES: openid
      OIDC_ALLOWED_ALGORITHMS: PS256
      SSL_CERT_FILE: /etc/fapi/ca.crt
    volumes:
      - ./.generated/pki/ca.crt:/etc/fapi/ca.crt:ro
      - ./.generated/pki/pop-verifier.crt:/etc/fapi/tls.crt:ro
      - ./.generated/pki/pop-verifier.key:/etc/fapi/tls.key:ro
    depends_on:
      - keycloak

  kong-api:
    profiles: [gateway]
    build:
      context: ./kong
    image: ghcr.io/picketfence-labs/konnect-oidc-fapi2-keycloak:${KONG_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - path: ./.generated/runtime-api.env
        required: false
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: ${KONNECT_API_CP_HOST:?render API Konnect target first}:443
      KONG_CLUSTER_SERVER_NAME: ${KONNECT_API_CP_HOST:?render API Konnect target first}
      KONG_CLUSTER_TELEMETRY_ENDPOINT: ${KONNECT_API_TP_HOST:?render API telemetry target first}:443
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: ${KONNECT_API_TP_HOST:?render API telemetry target first}
      KONG_CLUSTER_CERT: /etc/kong/certs/tls.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/certs/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system,/etc/kong/fapi/ca.crt
      KONG_NGINX_MAIN_ENV: "API_INTROSPECTION_KEY; env API_UPSTREAM_KEY"
      KONG_SSL_CERT: /etc/kong/fapi/api-gateway.crt
      KONG_SSL_CERT_KEY: /etc/kong/fapi/api-gateway.key
      KONG_KONNECT_MODE: "on"
      KONG_ROUTER_FLAVOR: expressions
      KONG_PROXY_LISTEN: "off"
      KONG_ADMIN_LISTEN: "off"
      KONG_PLUGINS: bundled
      KONG_LOG_LEVEL: notice
    volumes:
      - ./infra/certs/tls.crt:/etc/kong/certs/tls.crt:ro
      - ./infra/certs/tls.key:/etc/kong/certs/tls.key:ro
      - ./.generated/pki/ca.crt:/etc/kong/fapi/ca.crt:ro
      - ./.generated/pki/api-gateway.crt:/etc/kong/fapi/api-gateway.crt:ro
      - ./.generated/pki/api-gateway.key:/etc/kong/fapi/api-gateway.key:ro
      - ./.generated/pki/api-introspection.crt:/etc/kong/fapi/api-introspection.crt:ro
      - ./.generated/pki/api-introspection.key:/etc/kong/fapi/api-introspection.key:ro
      - ./.generated/pki/api-upstream.crt:/etc/kong/fapi/api-upstream.crt:ro
      - ./.generated/pki/api-upstream.key:/etc/kong/fapi/api-upstream.key:ro

  kong-third-party:
    profiles: [gateway]
    build:
      context: ./kong
    image: ghcr.io/picketfence-labs/konnect-oidc-fapi2-keycloak:${KONG_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - path: ./.generated/runtime-third-party.env
        required: false
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: ${KONNECT_THIRD_PARTY_CP_HOST:?render third-party Konnect target first}:443
      KONG_CLUSTER_SERVER_NAME: ${KONNECT_THIRD_PARTY_CP_HOST:?render third-party Konnect target first}
      KONG_CLUSTER_TELEMETRY_ENDPOINT: ${KONNECT_THIRD_PARTY_TP_HOST:?render third-party telemetry target first}:443
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: ${KONNECT_THIRD_PARTY_TP_HOST:?render third-party telemetry target first}
      KONG_CLUSTER_CERT: /etc/kong/certs/tls.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/certs/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system,/etc/kong/fapi/ca.crt
      FAPI_AS_TRANSPORT_ISSUER: https://localhost:8444/realms/fapi-demo
      FAPI_AS_TRANSPORT_INTERNAL_ORIGIN: https://keycloak:8443
      KONG_NGINX_MAIN_ENV: "ROUTE_A_TLS_KEY; env ROUTE_B_TLS_KEY; env FAPI_AS_TRANSPORT_ISSUER; env FAPI_AS_TRANSPORT_INTERNAL_ORIGIN"
      KONG_KONNECT_MODE: "on"
      KONG_ROUTER_FLAVOR: expressions
      KONG_PROXY_LISTEN: "off"
      KONG_ADMIN_LISTEN: "off"
      KONG_PLUGINS: bundled,fapi-as-mtls-transport,fapi-client-auth-bridge
      KONG_LOG_LEVEL: notice
    volumes:
      - ./infra/certs/third-party/tls.crt:/etc/kong/certs/tls.crt:ro
      - ./infra/certs/third-party/tls.key:/etc/kong/certs/tls.key:ro
      - ./.generated/pki/ca.crt:/etc/kong/fapi/ca.crt:ro
      - ./.generated/pki/third-party-metadata.crt:/etc/kong/fapi/third-party-metadata.crt:ro
      - ./.generated/pki/third-party-metadata.key:/etc/kong/fapi/third-party-metadata.key:ro
      - ./.generated/pki/route-a.crt:/etc/kong/fapi/route-a.crt:ro
      - ./.generated/pki/route-a.key:/etc/kong/fapi/route-a.key:ro
      - ./.generated/pki/route-b.crt:/etc/kong/fapi/route-b.crt:ro
      - ./.generated/pki/route-b.key:/etc/kong/fapi/route-b.key:ro
      - ./.generated/pki/route-b-pkj.key:/etc/kong/fapi/route-b-pkj.key:ro

  ui:
    profiles: [demo]
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./ui/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.generated/pki/ui.crt:/etc/nginx/tls/tls.crt:ro
      - ./.generated/pki/ui.key:/etc/nginx/tls/tls.key:ro
    ports:
      - "3000:80"
      - "3443:443"
