server {
    listen 80;
    server_name ui;
    access_log off;
    large_client_header_buffers 4 32k;
    client_header_buffer_size 4k;
    root /usr/share/nginx/html;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /evidence.js { try_files $uri =404; }
    location / { return 404; }
}
